<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robux Chat ON</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: white;
    }

    #numero {
      font-size: 40px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="numero">
    Carregando...
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const numero = params.get("numero");

    if (numero) {
      document.getElementById("numero").textContent =
        "Número recebido: " + numero;
    } else {
      document.getElementById("numero").textContent =
        "Nenhum número recebido.";
    }
  </script>

</body>
</html>
